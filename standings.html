<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FF Standings</title>
  <link rel="stylesheet" href="standings.css">
</head>
<body>

<div class="poster">

 <!-- two logos positioned at top‑left like screenshot -->
<div class="top-logos">
  
  <!-- Left Side (2 logos) -->
  <div class="logo-left">
    <img src="assets/platform-partner.png" class="small-logo" alt="logo1">
    <img src="assets/presentedby.png" class="small-logo1" alt="logo2">
  </div>

  <!-- Center (Asia logo bigger) -->
  <div class="logo-center">
    <img src="assets/asia.png" class="center-logo" alt="asia">
  </div>

  <!-- Right Side (1 logo) -->
  <div class="logo-right">
    <img src="assets/managing-partner.png" class="right-logo" alt="logo3">
  </div>

</div>

<div class="header">
  <div class="standings-wrapper">
    <!-- title removed, input becomes focal -->
    <div class="standings-input">
      <input type="text" id="userInput" class="user-input" placeholder="Write text here">
    </div>
  </div>
</div>

  <!-- TABLE HEADER -->
  <div class="table-head">
    <div>RANK</div>
    <div>TEAM NAME</div>
    <div><img src="assets/booyah.png" class="booyah"></div>
    <!-- games column removed -->
    <div>POS</div>
    <div>ELIMS</div>
    <div>TOTAL</div>
  </div>

  <!-- TABLE -->
  <div id="tableBody"></div>
  <div class="download-wrapper no-export">
    <button id="uploadMoreBtn" class="upload-btn" onclick="window.location.href='index.html';">
    Upload More Files
  </button>
    <button id="downloadBtn" class="download-btn">Download PNG</button>
    <button id="resetBtn" class="reset-btn">
    Reset Standings
  </button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="script.js"></script>
</body>
</html>
